<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>ELL AI • Classroom</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f4f4ff;background:#090e1d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#242052 0%,transparent 38%),#090e1d;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.app{max-width:1300px;margin:auto;min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #29304d;gap:12px}.brand{font-weight:900;font-size:22px;letter-spacing:-.8px}.brand span{color:#a991ff}.pill{font-size:12px;background:#26224b;padding:8px 12px;border-radius:30px;color:#c8c2ff}.shell{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 75px)}aside{padding:18px;border-right:1px solid #29304d}.nav{display:flex;flex-direction:column;gap:8px}.nav button{border:0;text-align:left;padding:13px 14px;border-radius:13px;color:#bfc5e3;background:transparent}.nav button.active,.nav button:hover{background:#302658;color:white}.content{padding:28px;min-width:0}h1{font-size:clamp(27px,3vw,42px);letter-spacing:-1px;margin:0 0 10px}h2{font-size:21px;margin:0 0 14px}h3{margin:0 0 10px}p{line-height:1.65;color:#c2c8e4}.muted{color:#9fa8cd;font-size:13px}.eyebrow{color:#b69aff;text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:linear-gradient(150deg,#171d36,#12192d);border:1px solid #303754;border-radius:20px;padding:22px;min-width:0}.hero{background:linear-gradient(125deg,#3c286f,#17294b);border:1px solid #6a57aa;border-radius:22px;padding:28px;margin-bottom:20px}.btn{border:0;background:linear-gradient(120deg,#8666f6,#5c83ff);color:#fff;border-radius:12px;padding:12px 18px;font-weight:750}.secondary{background:#2b3555;color:#fff}.danger{background:#69354b}.tiny{padding:8px 12px;font-size:12px}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{color:#c6cce7;font-size:13px}input,select,textarea{background:#0e152a;color:#fff;border:1px solid #414968;border-radius:11px;padding:12px;width:100%;outline:none}textarea{min-height:92px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#ad92ff}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.tag{display:inline-block;background:#272b50;border:1px solid #4b477e;border-radius:30px;padding:6px 10px;font-size:12px;margin:4px 4px 4px 0}.hidden{display:none!important}.notice{border-left:3px solid #9e84ff;padding:10px 14px;background:#222344;border-radius:8px;color:#d6d6f1;margin:12px 0}.avatar{width:150px;height:170px;margin:auto;position:relative}.hair{position:absolute;left:29px;top:7px;width:92px;height:115px;border-radius:48px 48px 28px 28px;background:#292036}.face{position:absolute;left:41px;top:24px;width:69px;height:90px;border-radius:40% 40% 44% 44%;background:linear-gradient(120deg,#e6ae87,#b9795f);box-shadow:inset -10px -3px #a66e59}.eye{position:absolute;top:42px;width:8px;height:8px;border-radius:50%;background:#2d2430}.eye.left{left:16px}.eye.right{right:16px}.mouth{position:absolute;top:65px;left:26px;width:19px;height:5px;border-radius:50%;background:#743e46;transition:height .15s}.speaking .mouth{animation:talk .24s infinite alternate}@keyframes talk{to{height:17px;border-radius:40%}}.bodyavatar{position:absolute;top:112px;left:15px;width:120px;height:58px;background:linear-gradient(120deg,#7a69dd,#4e63b9);border-radius:55px 55px 12px 12px}.avatar.male .hair{height:52px;border-radius:42px 42px 10px 10px}.avatar.male .face{top:29px}.teacher-stage{background:radial-gradient(circle at 50% 10%,#413879,#1b2544 58%,#121a31);border-radius:19px;padding:20px;text-align:center}.chatlog{height:250px;overflow:auto;border:1px solid #313b58;border-radius:12px;padding:12px;background:#0b1327}.bubble{padding:10px 13px;border-radius:13px;max-width:90%;margin:8px 0;background:#293456;white-space:pre-wrap}.bubble.me{background:#493d84;margin-left:auto}.question{padding:15px;border:1px solid #353e61;border-radius:13px;margin:12px 0}.question label{display:block;padding:7px}.progress{height:10px;background:#2d3351;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#9b72ff,#6cafff)}.flash{min-height:180px;display:grid;place-items:center;text-align:center;border:1px dashed #9c82ee;border-radius:18px;background:#202344;font-size:25px;font-weight:750;padding:22px}.filebox{border:1px dashed #8b78cf;border-radius:12px;padding:14px;margin-top:12px}.small{font-size:12px}.onboard{max-width:700px;margin:45px auto;padding:20px}.center{text-align:center}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.footer{font-size:12px;color:#8f98bd;margin-top:32px}.stat{font-size:32px;font-weight:900;color:#b3a1ff}.photo{max-width:100%;max-height:250px;border-radius:12px;margin:12px 0}.rtl{direction:rtl;text-align:right}@media(max-width:760px){.shell{display:block}aside{border-right:0;border-bottom:1px solid #29304d;padding:10px;overflow:auto}.nav{flex-direction:row;min-width:max-content}.nav button{white-space:nowrap;font-size:12px;padding:10px}.content{padding:17px}.grid,.three{grid-template-columns:1fr}.top{padding:14px}.onboard{margin:8px auto}.hero{padding:20px}}
</style></head><body><div class="app"><header class="top"><div class="brand">✦ ELL<span> AI</span> <span class="muted">CLASSROOM</span></div><div class="row"><span class="pill" id="roleBadge">GIC • SDG 4</span><button id="switchBtn" class="btn secondary tiny hidden">Switch role</button></div></header><div id="onboard" class="onboard"><div class="hero"><div class="eyebrow">English for everyone</div><h1>One lesson. Every learner. Their own language.</h1><p>A classroom companion for multilingual ELL students and their teachers.</p></div><div class="card"><h2>Get started</h2><div class="grid"><button class="btn" id="studentRole">🎓 I'm a student</button><button class="btn secondary" id="teacherRole">👩‍🏫 I'm a teacher</button></div><p class="muted">Prototype only: no accounts or real school access controls yet. Do not upload sensitive student records.</p></div></div><div id="workspace" class="shell hidden"><aside><nav class="nav" id="nav"></nav></aside><main class="content" id="page"></main></div></div><script>
'use strict';const KEY='ell_ai_gic_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch{db={}};db.classes??=[];db.sessions??=[];db.homework??=[];db.answers??=[];db.feedback??=[];db.name??='';db.language??='Persian';db.avatar??='female';db.role??='';db.classId??='';db.minutes??=0;db.term??='Term 1';let view='dashboard',speaking=false,flashIndex=0,flashFlip=false;const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Storage full. Please use smaller files.')}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2,8).toUpperCase();const today=()=>new Date().toISOString().slice(0,10);const subject='ELL';const lessons=[{title:'Understanding a story',objective:'Identify characters, setting, and main idea.',text:'A story usually has characters, a setting and events. The main idea is what the story is mostly about.',fa:'یک داستان معمولاً شخصیت‌ها، مکان و اتفاق‌ها دارد. ایدهٔ اصلی یعنی داستان بیشتر دربارهٔ چه چیزی است.',words:[['character','شخصیت'],['setting','محل اتفاق'],['main idea','ایده اصلی']]},{title:'Making clear sentences',objective:'Write a sentence with a subject and a verb.',text:'A clear sentence tells us who or what, and what happens. Example: The student reads a book.',fa:'یک جملهٔ واضح می‌گوید چه کسی یا چه چیزی، چه کاری انجام می‌دهد. مثال: دانش‌آموز کتاب می‌خواند.',words:[['subject','فاعل'],['verb','فعل'],['sentence','جمله']]},{title:'Finding evidence',objective:'Support an answer with a detail from a text.',text:'Evidence is a detail from the text that supports your answer. Use: I think this because the text says...',fa:'شاهد، جزئیاتی از متن است که پاسخ تو را پشتیبانی می‌کند. از جملهٔ «فکر می‌کنم چون متن می‌گوید...» استفاده کن.',words:[['evidence','شاهد'],['detail','جزئیات'],['support','پشتیبانی کردن']]}];const vocab=lessons.flatMap(l=>l.words);const navItems={student:[['dashboard','⌂ Home'],['classroom','◉ AI ELL Teacher'],['helper','✦ Study Helper'],['quiz','✓ Quiz'],['homework','▣ Homework'],['flashcards','▤ Flashcards'],['scan','▧ Scan worksheet'],['progress','↗ Progress'],['settings','⚙ Settings']],teacher:[['dashboard','⌂ Overview'],['classes','▦ Classes'],['planner','▤ Term planner'],['homework','▣ Assignments'],['progress','↗ Class insights'],['settings','⚙ Settings']]};function role(r){db.role=r;save();view='dashboard';render()}function start(){const r=db.role;if(!r){$('onboard').classList.remove('hidden');$('workspace').classList.add('hidden');$('switchBtn').classList.add('hidden');return}$('onboard').classList.add('hidden');$('workspace').classList.remove('hidden');$('switchBtn').classList.remove('hidden');$('roleBadge').textContent=r==='teacher'?'Teacher preview':'Student preview';$('nav').innerHTML=navItems[r].map(([id,name])=>`<button data-view="${id}" class="${id===view?'active':''}">${name}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()})}function render(){start();if(!db.role)return;const fn=pages[view]||pages.dashboard;$('page').innerHTML=fn();bind()}function activeClass(){return db.classes.find(c=>c.id===db.classId)}function classSessions(){return db.sessions.filter(s=>s.classId===db.classId)}function classHW(){return db.homework.filter(h=>h.classId===db.classId)}function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}const pages={dashboard(){if(db.role==='teacher')return `<div class="eyebrow">Teacher studio</div><h1>Build a better ELL classroom.</h1><p>Create class codes, organize a term, upload teaching resources, and review learning check-ins.</p><div class="grid three">${card('Classes',`<div class="stat">${db.classes.length}</div><p>Class groups</p><button class="btn" data-go="classes">Manage classes</button>`)}${card('Planned lessons',`<div class="stat">${db.sessions.length}</div><p>Term sessions</p><button class="btn" data-go="planner">Open planner</button>`)}${card('Assigned homework',`<div class="stat">${db.homework.length}</div><p>Tasks</p><button class="btn" data-go="homework">Assignments</button>`)}</div><div class="notice">Teacher controls are a local prototype. Real teacher/student synchronization requires login, database and server permissions.</div>`;let c=activeClass();return `<div class="eyebrow">Your personal ELL classroom</div><h1>Welcome${db.name?', '+esc(db.name):''} ✨</h1><p>Learn the same topic as your class, with simpler English and support in your own language.</p><div class="hero"><h2>${c?'Class '+esc(c.name):'Join your ELL class'}</h2><p>${c?'Your teacher’s plan appears below.':'Ask your teacher for a class code, or try the built-in sample lessons.'}</p><div class="actions"><button class="btn" data-go="classroom">Start learning →</button><button class="btn secondary" data-go="settings">${c?'Change class':'Enter class code'}</button></div></div><div class="grid three">${card('ELL Teacher','Practice reading, writing and vocabulary with spoken explanations.<div class="actions"><button class="btn tiny" data-go="classroom">Open</button></div>')}${card('Your homework',`<div class="stat">${classHW().length}</div><p>Assigned tasks</p><button class="btn tiny" data-go="homework">View tasks</button>`)}${card('Study progress',`<div class="stat">${db.answers.length}</div><p>Quiz attempts recorded on this device</p><button class="btn tiny" data-go="progress">View</button>`)}</div>`},classroom(){const l=lessons[Number(db.lessonIndex||0)%lessons.length];return `<div class="eyebrow">Live learning space • ELL</div><h1>Meet your ELL teacher</h1><div class="grid"><div class="teacher-stage"><div class="avatar ${db.avatar==='male'?'male':''}" id="avatar"><div class="hair"></div><div class="bodyavatar"></div><div class="face"><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i></div></div><h2>${db.avatar==='male'?'Alex':'Maya'} • AI teacher preview</h2><p class="muted">Animated illustration — not a photorealistic or live AI avatar.</p><div class="actions" style="justify-content:center"><button class="btn" id="speakLesson">▶ Speak lesson</button><button class="btn secondary" id="stopSpeech">■ Stop</button></div></div>${card('Today’s lesson',`<span class="tag">${subject}</span><span class="tag">${esc(db.language)} support</span><h2>${esc(l.title)}</h2><p><b>Goal:</b> ${esc(l.objective)}</p><p>${esc(l.text)}</p><details><summary>Explain in Persian (sample)</summary><p class="rtl">${esc(l.fa)}</p></details><div class="actions"><button class="btn" id="nextLesson">Next lesson →</button><button class="btn secondary" data-go="quiz">Try quiz</button></div>`)}</div><div class="notice">For real-time open-ended voice conversation, connect an AI backend. This offline demo uses browser speech synthesis.</div>`},helper(){return `<div class="eyebrow">Study helper</div><h1>Ask for help with English</h1><p>This demo provides a few guided answers. It is not connected to OpenAI yet.</p>${card('Learning chat',`<div class="chatlog" id="chatlog"><div class="bubble">Hi! Ask me about vocabulary, grammar, stories or evidence. I can give a simple explanation.</div></div><div class="field"><label for="chatInput">Your question</label><input id="chatInput" placeholder="What does evidence mean?"></div><div class="actions"><button class="btn" id="sendChat">Send</button><button class="btn secondary" id="speakReply">Read last reply</button></div>`)}`},quiz(){return `<div class="eyebrow">Quick check</div><h1>ELL knowledge quiz</h1><p>Practice at your own pace. Your result stays on this device.</p>${card('Three questions',`<form id="quizForm"><div class="question"><b>1. What is a character in a story?</b><label><input type="radio" name="q1" value="a" style="width:auto"> A person or animal in the story</label><label><input type="radio" name="q1" value="b" style="width:auto"> The time of day</label></div><div class="question"><b>2. Which is a complete sentence?</b><label><input type="radio" name="q2" value="a" style="width:auto"> The blue book</label><label><input type="radio" name="q2" value="b" style="width:auto"> The student reads.</label></div><div class="question"><b>3. What is evidence?</b><label><input type="radio" name="q3" value="a" style="width:auto"> A detail supporting an answer</label><label><input type="radio" name="q3" value="b" style="width:auto"> A random guess</label></div><button class="btn" type="submit">Check answers</button></form><div id="quizResult"></div>`)}`},homework(){if(db.role==='teacher')return `<div class="eyebrow">Teacher studio</div><h1>Homework & practice</h1>${card('Create assignment',`<form id="hwForm"><div class="field"><label>Class</label><select name="classId" required>${db.classes.map(c=>`<option value="${c.id}">${esc(c.name)} (${esc(c.code)})</option>`).join('')}</select></div><div class="field"><label>Task title</label><input name="title" required placeholder="Read the story and write 3 sentences"></div><div class="field"><label>Instructions</label><textarea name="instructions" required></textarea></div><div class="field"><label>Due date</label><input name="due" type="date" value="${today()}"></div><button class="btn" ${db.classes.length?'':'disabled'}>Assign</button></form>`)}<div style="height:16px"></div>${card('Existing tasks',db.homework.length?db.homework.map(h=>`<div class="question"><b>${esc(h.title)}</b><p>${esc(h.instructions)}</p><span class="muted">${esc(h.due)}</span></div>`).join(''):'<p>No assignments yet.</p>')}`;return `<div class="eyebrow">Your tasks</div><h1>Homework</h1>${classHW().length?classHW().map(h=>card(esc(h.title),`<p>${esc(h.instructions)}</p><p class="muted">Due: ${esc(h.due)}</p><div class="field"><label>Your written response</label><textarea id="response_${h.id}" placeholder="Write your answer here..."></textarea></div><button class="btn" data-save-hw="${h.id}">Save response</button>`)).join('<div style="height:16px"></div>'):'<div class="notice">No homework assigned for your selected class. You can still use quizzes and flashcards.</div>'}`},flashcards(){const [word,meaning]=vocab[flashIndex%vocab.length];return `<div class="eyebrow">Vocabulary lab</div><h1>Flashcards</h1><p>Tap the card to reveal its meaning.</p>${card('Card '+(flashIndex%vocab.length+1)+' of '+vocab.length,`<div class="flash" id="flipCard">${flashFlip?esc(meaning):esc(word)}</div><div class="actions"><button class="btn secondary" id="flipBtn">Flip card</button><button class="btn" id="nextFlash">Next →</button></div>`)}`},scan(){return `<div class="eyebrow">Paper-to-digital</div><h1>Worksheet scan</h1><p>Take a photo of your completed paper worksheet and preview it.</p>${card('Upload your work',`<div class="field"><label>Photo of your worksheet</label><input type="file" id="scanFile" accept="image/*" capture="environment"></div><div id="scanPreview"></div><div class="notice">This prototype can show your photo, but cannot read handwriting or mark it automatically. That needs a vision AI service and secure upload processing. No photo is sent to a server.</div><button class="btn" data-go="classroom">Back to lesson</button>`)}`},progress(){const avg=db.answers.length?Math.round(db.answers.reduce((s,x)=>s+x.score,0)/db.answers.length):0;if(db.role==='teacher')return `<div class="eyebrow">Class insights</div><h1>Learning overview</h1>${card('Prototype reporting',`<p>Classes created: <b>${db.classes.length}</b></p><p>Lessons planned: <b>${db.sessions.length}</b></p><p>Homework assigned: <b>${db.homework.length}</b></p><div class="notice">Real per-student reports, study hours and attendance require authenticated student accounts, server events and consent. This preview does not secretly track students.</div>`)}`;return `<div class="eyebrow">Your journey</div><h1>Learning progress</h1><div class="grid">${card('Quiz average',`<div class="stat">${avg}%</div><div class="progress"><div style="width:${avg}%"></div></div><p>${db.answers.length} attempts on this device</p>`)}${card('Your reflection',`<p>What was easy today? What should we practice again?</p><textarea id="reflection" placeholder="Today I learned...">${esc(db.reflection||'')}</textarea><button class="btn" id="saveReflection">Save reflection</button>`)}</div><div class="notice">This report reflects only activity saved in this browser. It does not prove total study time or show activity in other apps.</div>`},classes(){return `<div class="eyebrow">Teacher studio</div><h1>Class groups & invite codes</h1>${card('Create ELL class',`<form id="classForm"><div class="grid"><div class="field"><label>Class name</label><input name="name" required placeholder="Year 8 ELL A"></div><div class="field"><label>Year group</label><select name="year"><option>Year 7</option><option>Year 8</option><option>Year 9</option><option>Year 10</option><option>Year 11</option><option>Grade 8</option><option>MYP</option></select></div></div><button class="btn">Create class code</button></form>`)}<div style="height:16px"></div>${card('Your classes',db.classes.length?db.classes.map(c=>`<div class="question"><b>${esc(c.name)}</b> <span class="tag">${esc(c.year)}</span><p>Invite code: <strong>${esc(c.code)}</strong></p><button class="btn tiny secondary" data-copy="${esc(c.code)}">Copy code</button></div>`).join(''):'<p>Create a class to get started.</p>')}`},planner(){return `<div class="eyebrow">Term planning</div><h1>Teacher term planner</h1><p>Plan each term separately. The AI planning feature is a future server integration; this version generates an editable lesson sequence from the details you provide.</p>${card('Term details',`<form id="planForm"><div class="grid"><div class="field"><label>Class</label><select name="classId">${db.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Term</label><select name="term"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></div><div class="field"><label>Weeks in term</label><input type="number" name="weeks" min="1" max="16" value="8"></div><div class="field"><label>Lessons per week</label><input type="number" name="perWeek" min="1" max="7" value="3"></div><div class="field"><label>Minutes per lesson</label><input type="number" name="duration" min="10" max="180" value="45"></div><div class="field"><label>Days</label><input name="days" placeholder="Mon, Wed, Fri" value="Mon, Wed, Fri"></div></div><div class="field"><label>Term topics (one per line)</label><textarea name="topics" placeholder="Reading comprehension&#10;Sentence structure&#10;Vocabulary"></textarea></div><div class="filebox"><b>Teaching materials</b><p class="muted">Choose PPTX/PDF for file name preview. This browser-only demo does not read slide content. Do not upload confidential student data.</p><input type="file" id="resourceFile" accept=".pptx,.pdf,.ppt"><div id="resourceName" class="muted"></div></div><div class="actions"><button class="btn" ${db.classes.length?'':'disabled'}>Generate lesson outline</button></div></form>`)}<div style="height:16px"></div>${card('Planned sessions',db.sessions.length?db.sessions.slice(-60).map(s=>`<div class="question"><b>${esc(s.term)} • Session ${s.number}: ${esc(s.topic)}</b><p>${esc(s.day)} • ${esc(s.duration)} minutes • ${esc(s.className)}</p></div>`).join(''):'<p>No lessons planned yet.</p>')}`},settings(){return `<div class="eyebrow">Preferences</div><h1>Settings</h1>${card('Your profile',`<form id="settingsForm"><div class="field"><label>Display name</label><input name="name" value="${esc(db.name)}" placeholder="Your first name"></div><div class="field"><label>Explanation language</label><select name="language">${['Persian','English','Arabic','Turkish','Hindi','Urdu','Spanish','French','Chinese','Russian'].map(x=>`<option ${db.language===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Teacher avatar</label><select name="avatar"><option value="female" ${db.avatar==='female'?'selected':''}>Maya (female)</option><option value="male" ${db.avatar==='male'?'selected':''}>Alex (male)</option></select></div>${db.role==='student'?`<div class="field"><label>Teacher’s class invite code</label><input name="classCode" value="${esc(activeClass()?.code||'')}" placeholder="e.g. ELL-ABC123"></div>`:''}<button class="btn">Save settings</button></form><div class="notice">Languages other than Persian and English are selectable for future AI integration; the built-in lessons currently include English and sample Persian explanations.</div>`)}`}};
function say(text,lang='en-US'){if(!('speechSynthesis'in window)){alert('Speech synthesis is not supported in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.86;u.onstart=()=>{$('avatar')?.classList.add('speaking')};u.onend=u.onerror=()=>{$('avatar')?.classList.remove('speaking')};speechSynthesis.speak(u)}let lastReply='';function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render()});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy).then(()=>alert('Code copied')).catch(()=>prompt('Copy code:',b.dataset.copy))});if($('settingsForm'))$('settingsForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.name=f.get('name').trim();db.language=f.get('language');db.avatar=f.get('avatar');if(db.role==='student'){const code=(f.get('classCode')||'').trim().toUpperCase();const found=db.classes.find(c=>c.code===code);if(code&&!found){alert('Class not found on this device. Real cross-device class joining needs an online database.');return}db.classId=found?.id||''}save();render();alert('Settings saved')};if($('classForm'))$('classForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.classes.push({id:uid(),name:f.get('name').trim(),year:f.get('year'),code:'ELL-'+uid()});save();render()};if($('resourceFile'))$('resourceFile').onchange=e=>{$('resourceName').textContent=e.target.files[0]?`Selected: ${e.target.files[0].name} (not uploaded or analyzed)`:'No file selected'};if($('planForm'))$('planForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),c=db.classes.find(x=>x.id===f.get('classId'));if(!c)return;const weeks=+f.get('weeks'),pw=+f.get('perWeek'),topics=f.get('topics').split('\n').map(x=>x.trim()).filter(Boolean);const fallback=['Reading comprehension','Vocabulary in context','Writing clear sentences','Speaking practice','Using evidence'];const days=f.get('days').split(',').map(x=>x.trim()).filter(Boolean);for(let i=0;i<weeks*pw;i++)db.sessions.push({id:uid(),classId:c.id,className:c.name,term:f.get('term'),number:i+1,topic:(topics.length?topics:fallback)[i%(topics.length||fallback.length)],day:`Week ${Math.floor(i/pw)+1} • ${days[i%pw]||'Lesson '+(i%pw+1)}`,duration:f.get('duration')});save();render();alert('Outline generated. Review it before using it in class.')};if($('hwForm'))$('hwForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.homework.push({id:uid(),classId:f.get('classId'),title:f.get('title'),instructions:f.get('instructions'),due:f.get('due')});save();render()};document.querySelectorAll('[data-save-hw]').forEach(b=>b.onclick=()=>{db['hw_'+b.dataset.saveHw]=$('response_'+b.dataset.saveHw).value;save();alert('Saved locally on this device')});if($('speakLesson'))$('speakLesson').onclick=()=>say(lessons[Number(db.lessonIndex||0)%lessons.length].text);if($('stopSpeech'))$('stopSpeech').onclick=()=>{speechSynthesis.cancel();$('avatar')?.classList.remove('speaking')};if($('nextLesson'))$('nextLesson').onclick=()=>{db.lessonIndex=(Number(db.lessonIndex||0)+1)%lessons.length;save();render()};if($('sendChat')){const send=()=>{const t=$('chatInput').value.trim();if(!t)return;const q=t.toLowerCase();lastReply=q.includes('evidence')?'Evidence is a detail from the text that supports your answer.':q.includes('verb')?'A verb describes an action or state. For example: read, write, is.':q.includes('character')?'A character is a person or animal in a story.':q.includes('sentence')?'A complete sentence usually has a subject and a verb.':'I can help with evidence, verbs, characters and sentences in this offline demo. For other questions, connect the secure AI backend.';$('chatlog').insertAdjacentHTML('beforeend',`<div class="bubble me">${esc(t)}</div><div class="bubble">${esc(lastReply)}</div>`);$('chatInput').value='';$('chatlog').scrollTop=$('chatlog').scrollHeight};$('sendChat').onclick=send;$('chatInput').onkeydown=e=>{if(e.key==='Enter')send()};$('speakReply').onclick=()=>say(lastReply||'Ask a question first.')};if($('quizForm'))$('quizForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(!f.get('q1')||!f.get('q2')||!f.get('q3')){alert('Please answer all three questions.');return}const score=([f.get('q1')==='a',f.get('q2')==='b',f.get('q3')==='a'].filter(Boolean).length/3)*100;db.answers.push({date:today(),score:Math.round(score)});save();$('quizResult').innerHTML=`<div class="notice"><b>Your score: ${Math.round(score)}%</b><p>Answers: 1. A (character); 2. B (complete sentence); 3. A (evidence). Review the lesson and try again!</p></div>`};if($('flipBtn')){$('flipBtn').onclick=()=>{flashFlip=!flashFlip;render()};$('flipCard').onclick=$('flipBtn').onclick;$('nextFlash').onclick=()=>{flashIndex++;flashFlip=false;render()}}if($('scanFile'))$('scanFile').onchange=e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Please select an image');return}const url=URL.createObjectURL(file);$('scanPreview').innerHTML='<p class="muted">Image preview only. No automatic marking.</p>';const img=document.createElement('img');img.className='photo';img.alt='Uploaded worksheet preview';img.src=url;img.onload=()=>URL.revokeObjectURL(url);$('scanPreview').appendChild(img)};if($('saveReflection'))$('saveReflection').onclick=()=>{db.reflection=$('reflection').value;save();alert('Reflection saved')}}$('studentRole').onclick=()=>role('student');$('teacherRole').onclick=()=>role('teacher');$('switchBtn').onclick=()=>{speechSynthesis?.cancel();db.role='';save();render()};render();
</script></body></html>
